[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snap_simulate"
version = "0.0.1"
dependencies = [
    "snap_workflow",
    "snap_analyze",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
snap_simulate = ["templates/*", "templates/**/*"]

