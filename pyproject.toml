[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pySNAP"
version = "1.0.0"
dependencies = [
    "snap_workflow",
    "snap_simulate",
    "snap_analyze",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
